# nginx.conf for the Perplexity web app Phase 1 placeholder.
#
# Fastest practical routing:
# - The container uses normal Docker bridge networking so Coolify/Traefik
#   can discover and proxy it reliably.
# - Spark is mapped into the container via extra_hosts to its Tailscale IP.
# - No Tailscale sidecar is used because the Coolify host is already on
#   the tailnet.

upstream perplexity_webapp {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location / {
        return 200 'Phase 1 scaffold live. Spark RPC upstream: http://spark-341c.tailc48b95.ts.net:8443\n';
    }

    location /health {
        return 200 'ok\n';
    }
}
