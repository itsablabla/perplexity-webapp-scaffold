# nginx.conf for the Perplexity web app reverse proxy.
#
# Mount this file at /etc/nginx/nginx.conf (or use it as an included site).
# Adjust $upstream if your Coolify proxy routes to a different service/port.

upstream perplexity_webapp {
    server 172.28.0.1:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://perplexity_webapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
