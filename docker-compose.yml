# Perplexity Web App — Phase 1 deployment scaffold
#
# This repo is intentionally minimal and public. It contains only the
# deployment configuration needed by Coolify. All secrets are supplied
# through Coolify environment variables and never committed here.

# Required Coolify environment variables:
#   COMPOSE_PROJECT_NAME            e.g. perplexity-webapp
#   POSTGRES_USER                   Postgres user
#   POSTGRES_PASSWORD               Postgres password
#   POSTGRES_DB                     Postgres database
#   REDIS_PASSWORD                  Redis password (empty if unauthenticated)
#   PERPLEXITY_API_KEY              Perplexity API key
#   PERPLEXITY_WEBAPP_SECRET        Web app signing secret
#   PERPLEXITY_WEBAPP_PORT          Optional, default 3000
#   PERPLEXITY_WEBAPP_IMAGE         Optional, defaults to local build of ./app

services:
  webapp:
    image: ${PERPLEXITY_WEBAPP_IMAGE:-perplexity-webapp:latest}
    # In a full Coolify project the image can be built from the private app
    # repository; this scaffold keeps the public repo secret-free.
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=${PERPLEXITY_WEBAPP_PORT:-3000}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - PERPLEXITY_WEBAPP_SECRET=${PERPLEXITY_WEBAPP_SECRET}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "${PERPLEXITY_WEBAPP_PORT:-3000}:${PERPLEXITY_WEBAPP_PORT:-3000}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped

volumes:
  postgres-data:
