# Perplexity Web App — Phase 1 fast-loop deployment scaffold
#
# This public repo intentionally contains no secrets.
# Required Coolify environment variables:
#   PPLX_PAIRING_TOKEN
#   PPLX_RPC_UPSTREAM      e.g. http://spark-341c.tailc48b95.ts.net:8443
#   PPLX_SPARK_TAILNET_IP  e.g. 100.69.23.63
#   PPLX_PORT              optional, default 8080
#
# Phase 1 routing:
# - No Tailscale sidecar: the Coolify host is already on the tailnet.
# - Normal Docker bridge networking for reliable Coolify/Traefik discovery.
# - extra_hosts maps the Spark RPC hostname to Spark's tailnet IP.

services:
  webapp:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "spark-341c.tailc48b95.ts.net:${PPLX_SPARK_TAILNET_IP}"
    environment:
      - PPLX_PAIRING_TOKEN=${PPLX_PAIRING_TOKEN:?}
      - PPLX_RPC_UPSTREAM=${PPLX_RPC_UPSTREAM:?}
      - PPLX_SPARK_TAILNET_IP=${PPLX_SPARK_TAILNET_IP:?}
      - PPLX_PORT=${PPLX_PORT:-8080}
    ports:
      - "${PPLX_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
